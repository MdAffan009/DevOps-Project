#Replicas
replicaCount: 2

#Image
image:
  repository: robinparker995/devops-project
  tag: latest
  pullPolicy: Always

#Service
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

#Pod Resources
resources:
  requests:
    memory: "128Mi"
    cpu: "250m"

  limits:
    memory: "256Mi"
    cpu: "500m"


#Cluster Resource Quota
quota:
  requests:
    cpu: 2
    memory: 2Gi

  limits:
    cpu: 4
    memory: 4Gi

  maxpods: 8

#Hotrizontal Pod Autoscaler
minReplicas: 2
maxReplicas: 5
averageUtilization: 50

#Ingress Domain
ingress:
  className: nginx
  host: devops.local

#Config
config:
  port: "3000"

#Secret Fallback
secret:
  MONGO_URI: ""
  JWT_SECRET: ""
