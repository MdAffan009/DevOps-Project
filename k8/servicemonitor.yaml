apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: app-servicemonitor
  namespace: monitoring
  labels:
    release: monitoring

spec:
  selector:
    matchLabels: 
      app: webapp
  
  namespaceSelector:
    matchNames:
      - default
  
  endpoints:
  - port: http
    path: /metrics
    interval: 15s

